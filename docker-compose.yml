version: '3.8'

services:
  hier-classifier-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hier-classifier-api
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - ARTIFACTS_ROOT=/app
      - DEFAULT_ARTIFACTS_DIR=artifacts_best_gpu
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=8001
      - FLASK_DEBUG=0
    volumes:
      # Optional: mount artifacts from host if you want to update them without rebuilding
      # - ./artifacts_best_gpu:/app/artifacts_best_gpu:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

